# Compose network: proxy_pass host is the `api` service name, not 127.0.0.1.
# SPA files are bind-mounted to /usr/share/nginx/html (see docker-compose.yml).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location /health {
        proxy_pass http://api:3001/health;
    }

    # Hashed Vite assets are safe to cache forever. HTML and SPA route
    # fallbacks must be revalidated so a deployment never mixes an old entry
    # point with a new asset graph.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
