# Local stack: nginx (port 80) + API adapter (internal :3001).
# Build the SPA first: ./scripts/setup.sh
# Frontend dist is bind-mounted so you can rebuild without rebuilding the API image.

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    # Match server/.env.example. Add API keys here or via env_file: ./server/.env
    environment:
      PORT: "3001"
      LOCAL_FULL_ACCESS: "true"
      LOCAL_MEMORY_CACHE: "true"
      LOCAL_USERNAME: alexlux
      LOCAL_EMAIL: alexlux@local
      CACHE_TTL_SECONDS: "300"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
