# NetKnife local VM — only public listener.
#
# /        → Vite SPA (try_files → index.html for client routing)
# /api/*   → Node adapter on 127.0.0.1:3001 (prefix stripped)
# /health  → same process, no /api prefix (ops check)
#
# Install:
#   sudo cp deploy/nginx/netknife.conf /etc/nginx/sites-available/netknife
#   sudo ln -sf /etc/nginx/sites-available/netknife /etc/nginx/sites-enabled/netknife
#   sudo nginx -t && sudo systemctl reload nginx
#
# If the SPA 404s, root must point at a built frontend/dist (see README-LOCAL.md).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/netknife/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
